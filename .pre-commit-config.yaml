# https://pre-commit.com
#
# Install: pip install pre-commit && pre-commit install
#
# This hook runs for staged Jekyll content and updates eligible posts plus pages
# that opt in with `short_link: true` (~1s; it does not rewrite other pages).
repos:
  - repo: local
    hooks:
      - id: short-url-front-matter
        name: Sync short links in staged content
        language: system
        entry: bundle exec ruby scripts/backfill_short_url_front_matter.rb
        pass_filenames: true
        files: ^html/.*\.(md|html)$
