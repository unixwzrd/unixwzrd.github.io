name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install site tooling
        run: python -m pip install -r requirements.txt

      - name: Clean old site and cache
        run: |
          rm -rf _site
          rm -rf html/.jekyll-cache

      - name: Build with Jekyll
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --trace --verbose

      - name: Build search index
        run: |
          python -m pagefind --site _site --output-subdir pagefind \
            --root-selector '[data-pagefind-body]' \
            --exclude-selectors '[data-pagefind-ignore]' --force-language en
          test -s _site/pagefind/pagefind.js
          test -s _site/pagefind/pagefind-entry.json
          python -c 'import json; index=json.load(open("_site/pagefind/pagefind-entry.json")); assert index["languages"]["en"]["page_count"] > 0, "Empty search index"'

      - name: Verify reader experience and internal links
        run: |
          utils/bin/check-site test --site "$GITHUB_WORKSPACE/_site"

      - name: Report browser artifact retention (no deletion)
        run: utils/bin/check-site artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


