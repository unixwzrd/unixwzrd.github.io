name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Clean old site and cache
        run: |
          rm -rf _site
          rm -rf html/.jekyll-cache

      - name: Build with Jekyll
        run: |
          JEKYLL_ENV=production bundle exec jekyll build --trace --verbose

      - name: Verify short URL redirects
        run: |
          bundle exec ruby scripts/backfill_short_url_front_matter.rb --check
          ruby -e '
            missing = []
            Dir["html/**/*.md"].each do |path|
              File.readlines(path).grep(/^short_url:/).each do |line|
                url = line.split(/short_url:\s*/, 2)[1].to_s.strip.delete_prefix("\"").delete_suffix("\"")
                code = url[%r{/s/([^/]+)/?}, 1]
                next unless code
                redirect = File.join("_site", "s", code, "index.html")
                missing << "#{url} from #{path} missing #{redirect}" unless File.file?(redirect)
              end
            end
            abort("Missing generated short URL redirects:\n#{missing.join("\n")}") unless missing.empty?
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

