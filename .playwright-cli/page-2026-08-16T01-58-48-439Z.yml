          - generic [ref=e85]:
            - heading "Local Archives for ChatGPT Conversations" [level=2] [ref=e86]
            - paragraph [ref=e87]:
              - text: ChatGPT conversations often contain research, troubleshooting history, writing drafts, decisions, and project context that are easy to lose inside a hosted chat interface.
              - strong [ref=e88]: LogGPT for Safari
              - text: exports complete ChatGPT conversations as structured JSON so you can keep your own archive and decide what to do with it next.
            - paragraph [ref=e89]: The extension runs in Safari on macOS and is available through Apple’s App Store. It is useful when you want local control over your chat history, especially before turning conversations into Markdown, HTML, documentation, search indexes, or downstream AI context.
            - heading "Why It Matters" [level=2] [ref=e90]
            - paragraph [ref=e91]: AI chat history becomes more useful when it is portable. Exported conversations can be reviewed, backed up, searched, converted, chunked, or reused in local-first workflows instead of remaining trapped in a browser tab.
            - paragraph [ref=e92]:
              - text: LogGPT fits the broader Distributed Thinking Systems stack as the capture layer for ChatGPT history.
              - link "Extract Chat" [ref=e93] [cursor=pointer]:
                - /url: /projects/extract-chat/
              - text: turns those exports into readable Markdown or HTML, and tools such as
              - link "VenvUtil" [ref=e94] [cursor=pointer]:
                - /url: /projects/venvutil/
              - text: can help process larger archives for local AI and data workflows.
            - heading "Key Features" [level=2] [ref=e95]
            - list [ref=e96]:
              - listitem [ref=e97]:
                - strong [ref=e98]: Capture complete ChatGPT sessions
                - text: with a single click
              - listitem [ref=e99]:
                - strong [ref=e100]: Download conversations in structured JSON format
                - text: for easy storage and analysis
              - listitem [ref=e101]:
                - strong [ref=e102]: No external servers, no tracking, and full user control - runs entirely in your browser
              - listitem [ref=e103]:
                - strong [ref=e104]: Works with local processing tools
                - text: for review, conversion, chunking, and archival workflows
              - listitem [ref=e105]:
                - strong [ref=e106]: Supports context transfer
                - text: by making it easier to split exported files and reuse selected context in a new session
