      - generic [ref=e37]:
        - complementary "Series context" [ref=e38]:
          - paragraph [ref=e39]:
            - strong [ref=e40]:
              - text: Part 6A of
              - link "Local-First Agent Operations" [ref=e41] [cursor=pointer]:
                - /url: /blog/series/local-first-agent-operations/
              - text: ": the Hands-On companion to Part 6."
            - text: This article turns one part of the design into a small runnable example. It appears in the separate
            - link "Hands-On section" [ref=e42] [cursor=pointer]:
              - /url: /blog/hands-on/
            - text: so tutorials remain easy to find without being mixed into the main Technology index.
        - paragraph [ref=e43]: The main Part 6 article explains why I use a passive model proxy as a debugging instrument. This companion gives you a small version you can run, break, and inspect without pointing it at a real model or putting private prompt content into the retained metrics.
        - paragraph [ref=e44]: "The lab has three pieces:"
        - list [ref=e45]:
          - listitem [ref=e46]:
            - code [ref=e47]: passive_proxy_lab.py
            - text: forwards HTTP request and response bodies and writes content-free JSONL metrics.
          - listitem [ref=e48]:
            - code [ref=e49]: fake_model_upstream.py
            - text: behaves like a tiny deterministic chat-completion endpoint.
          - listitem [ref=e50]:
            - code [ref=e51]: test_passive_proxy_lab.py
            - text: proves the important claims with six canary tests.
        - paragraph [ref=e52]: All three use the Python standard library. There is no package installation step.
        - figure [ref=e53]:
          - 'link "Open full-size diagram: A three-terminal passive proxy lab with a deterministic fake model endpoint, an unchanged transport path, content-free JSONL metrics, and six regression canaries." [ref=e54]':
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-06a-passive-proxy-lab.svg&title=A+three-terminal+passive+proxy+lab+with+a+deterministic+fake+model+endpoint%2C+an+unchanged+transport+path%2C+content-free+JSONL+metrics%2C+and+six+regression+canaries.
            - img "A three-terminal passive proxy lab with a deterministic fake model endpoint, an unchanged transport path, content-free JSONL metrics, and six regression canaries." [ref=e55]
          - link "Open full-size diagram" [ref=e57] [cursor=pointer]:
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-06a-passive-proxy-lab.svg&title=A+three-terminal+passive+proxy+lab+with+a+deterministic+fake+model+endpoint%2C+an+unchanged+transport+path%2C+content-free+JSONL+metrics%2C+and+six+regression+canaries.
        - heading "What This Lab Proves" [level=2] [ref=e58]
        - paragraph [ref=e59]: The tests do not try to prove that this is a production model gateway. They prove a smaller set of properties that are easy to understand and hard to fake accidentally.
        - table [ref=e60]:
          - rowgroup [ref=e61]:
            - row [ref=e62]:
              - columnheader "Property" [ref=e63]
              - columnheader "Canary" [ref=e64]
          - rowgroup [ref=e65]:
            - row [ref=e66]:
              - cell "The request body is passive" [ref=e67]
              - cell "The fake upstream must receive exactly the bytes submitted to the proxy" [ref=e68]
            - row [ref=e69]:
              - cell "The response body is passive" [ref=e70]
              - cell "The caller must receive exactly the body bytes produced by the fake upstream" [ref=e71]
            - row [ref=e72]:
              - cell "Routine metrics are content-free" [ref=e73]
              - cell "Prompt, authorization, private query, and private path-segment markers must be absent from JSONL" [ref=e74]
            - row [ref=e75]:
              - cell "Existing evidence is restricted" [ref=e76]
              - cell [ref=e77]:
                - text: A pre-created
                - code [ref=e78]: "0644"
                - text: metric file must become
                - code [ref=e79]: "0600"
                - text: before the append
            - row [ref=e80]:
              - cell "Failure is bounded" [ref=e81]
              - cell "An unavailable upstream returns 502 and records an exception class, not its potentially sensitive message" [ref=e82]
            - row [ref=e83]:
              - cell "Upstream selection is deliberate" [ref=e84]
              - cell "A non-loopback upstream requires explicit opt-in, and an upstream URL containing user information is rejected" [ref=e85]
        - paragraph [ref=e86]:
          - text: The proxy still forwards the
          - code [ref=e87]: Authorization
          - text: "header because a real upstream may require it. It never writes headers to the metrics file. That distinction is worth testing: a value can be required for transport and still be forbidden from retained operational evidence."
        - heading "Get the Companion Files" [level=2] [ref=e88]
        - paragraph [ref=e89]: The complete files are available through the site’s source viewer. You can inspect them in place before downloading anything.
