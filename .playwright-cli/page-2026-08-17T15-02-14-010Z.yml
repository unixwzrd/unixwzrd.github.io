        - paragraph [ref=e108]: "Create a disposable working directory and download the three files:"
        - code [ref=e112]: mkdir -p /tmp/passive-proxy-lab cd /tmp/passive-proxy-lab curl -fsSLO https://unixwzrd.ai/assets/code/agent-optimization/post-06/passive_proxy_lab.py curl -fsSLO https://unixwzrd.ai/assets/code/agent-optimization/post-06/fake_model_upstream.py curl -fsSLO https://unixwzrd.ai/assets/code/agent-optimization/post-06/test_passive_proxy_lab.py
        - heading "Run the Regression Tests First" [level=2] [ref=e113]
        - paragraph [ref=e114]: "I prefer to begin with the executable contract before starting any servers manually:"
        - code [ref=e118]: python3 -m unittest -v test_passive_proxy_lab.py
        - paragraph [ref=e119]: The expected result is six passing tests. The suite creates temporary loopback listeners with operating-system-assigned ports, sends invented content through the proxy, checks the captured bytes, checks the returned body bytes, reads the metric record, and then removes the temporary evidence.
        - paragraph [ref=e120]: "The privacy test deliberately sends four markers through different surfaces:"
        - code [ref=e124]: private prompt text must not enter metrics Bearer lab-secret trace=private private-path-marker
        - paragraph [ref=e125]:
          - text: The body and header must reach the fake upstream, and the query and private path segment must remain part of the upstream request target. None may appear in the metrics file. The lab maps only a small fixed set of known endpoints to bounded values such as
          - code [ref=e126]: chat_completions
          - text: ","
          - code [ref=e127]: responses
          - text: ","
          - code [ref=e128]: models
          - text: ", and"
          - code [ref=e129]: health
          - text: ; every other target becomes
          - code [ref=e130]: other
          - text: . It never retains the arbitrary request path.
        - paragraph [ref=e131]: This is a useful pattern beyond this lab. If a log format is supposed to exclude content, do not verify that by reading a pleasant example. Inject markers into every sensitive surface and fail the test if any marker survives.
        - heading "Start the Fake Model Endpoint" [level=2] [ref=e132]
        - paragraph [ref=e133]: "Open one terminal in the companion directory and run:"
        - code [ref=e137]: python3 fake_model_upstream.py
        - paragraph [ref=e138]: It listens on loopback and accepts POST requests. It reads the body so the HTTP exchange completes correctly, but it does not print or retain that body. Every request receives the same invented OpenAI-compatible JSON response.
        - paragraph [ref=e139]: The zero token counts in that response are deliberate. This fake endpoint does not tokenize anything, so claiming a synthetic token count would make the example look more realistic at the expense of being truthful.
        - heading "Start the Passive Proxy" [level=2] [ref=e140]
        - paragraph [ref=e141]: "In a second terminal, still in the companion directory, run:"
        - code [ref=e145]: python3 passive_proxy_lab.py \ --upstream http://127.0.0.1:18081 \ --metrics ./passive-proxy-metrics.jsonl
        - paragraph [ref=e146]:
          - text: The proxy listens on a separate loopback port and forwards to the fake endpoint. Both listener and upstream default to local-only behavior. Before every append, the metrics writer verifies that the destination is a regular file and enforces mode
          - code [ref=e147]: "0600"
          - text: ", including when a permissive file already exists. A symbolic-link target is rejected where the platform provides the standard no-follow open flag."
        - paragraph [ref=e148]:
          - text: The proxy accepts GET, POST, PUT, PATCH, DELETE, and OPTIONS for experimentation. It filters a fixed set of common hop-by-hop headers, sets the upstream Host and Content-Length values, and otherwise leaves end-to-end headers available to the upstream. It does not parse additional header names nominated by an incoming
          - code [ref=e149]: Connection
          - text: header, which is one reason this remains a teaching artifact. Request and response bodies are handled as bytes. They are not decoded, normalized, reformatted, or rendered.
        - paragraph [ref=e150]:
          - text: The upstream URL must include an explicit host and port and may not contain user information, a query, or a fragment. Remote hosts also require
          - code [ref=e151]: "--allow-remote-upstream"
          - text: . Rejecting user information prevents a startup status line from reproducing embedded credentials.
        - heading "Send an Invented Chat Request" [level=2] [ref=e152]
        - paragraph [ref=e153]: "Use a third terminal to send a request through the proxy:"
        - code [ref=e157]: "curl --silent --show-error \\ --header 'Content-Type: application/json' \\ --header 'Authorization: Bearer invented-lab-token' \\ --data '{\"messages\":[{\"role\":\"user\",\"content\":\"Explain why passive observation matters.\"}]}' \\ 'http://127.0.0.1:18080/v1/chat/completions?session=invented'"
        - paragraph [ref=e158]: You should receive the deterministic response from the fake endpoint. The proxy did not generate that response and did not parse it before returning it.
        - paragraph [ref=e159]: "Now inspect the operational record:"
        - code [ref=e163]: tail -n 1 passive-proxy-metrics.jsonl | python3 -m json.tool
        - paragraph [ref=e164]: "The exact timestamp, request ID, byte counts, and duration will differ. The shape should resemble this sanitized example:"
        - code [ref=e168]: "{ \"duration_ms\": 1.234, \"error_class\": null, \"method\": \"POST\", \"request_bytes\": 88, \"request_id\": \"generated-lab-identifier\", \"response_bytes\": 251, \"route_class\": \"chat_completions\", \"status\": 200, \"ts\": \"generated UTC timestamp\" }"
        - paragraph [ref=e169]: Notice what is missing. There is no arbitrary request path, and there are no headers, token values, query parameters, request bodies, prompt fragments, replies, or client addresses. The route class and byte counts are useful for trend monitoring, but they cannot reconstruct the content.
        - paragraph [ref=e170]: "You can check the canaries directly:"
        - code [ref=e174]: if grep -Eq 'invented-lab-token|session=invented|passive observation matters' passive-proxy-metrics.jsonl; then echo 'privacy canary failed' else echo 'privacy canaries absent from metrics' fi
        - heading "Force an Upstream Failure" [level=2] [ref=e175]
        - paragraph [ref=e176]:
          - text: Stop the fake endpoint with Control-C, leave the proxy running, and send the request again. The proxy should return a short 502 response containing a generated request ID. Its metric record will have status
          - code [ref=e177]: "502"
          - text: and an
          - code [ref=e178]: error_class
          - text: ", but it will not record the exception message or upstream address."
        - paragraph [ref=e179]: "This is not enough error reporting for a production operator. It is the right amount for this lab because it demonstrates the boundary: routine metrics can identify the class and correlation point while detailed incident evidence remains a separate, more sensitive channel."
        - paragraph [ref=e180]: Restart the fake endpoint and the next request should succeed. That gives you a quick way to watch the status transition without changing the proxy configuration.
        - heading "Try Three Useful Experiments" [level=2] [ref=e181]
        - paragraph [ref=e182]: First, change whitespace inside the JSON body and rerun the byte-preservation test. A proxy that parses and reserializes JSON may preserve meaning while changing bytes. This lab’s contract is stricter, so the upstream capture must match the original body exactly.
        - paragraph [ref=e183]: Second, add more canaries. Put an invented secret in a header, a query parameter, a variable path segment, and a nested message. Then extend the test assertion before changing the proxy. This turns the privacy rule into a regression boundary rather than a comment future code can ignore.
        - paragraph [ref=e184]:
          - text: Third, add a
          - code [ref=e185]: Content-Encoding
          - text: or unusual content type and observe that the proxy does not need to understand the payload to forward its bytes. Be careful not to mistake this for complete HTTP compliance. The lab buffers complete bodies and does not implement chunked request streaming.
        - heading "What I Would Add Before Real Use" [level=2] [ref=e186]
        - paragraph [ref=e187]: I would not place this teaching proxy on a shared network. A production component needs streaming request and response handling, bounded body sizes, TLS policy, authentication, concurrency limits, timeouts suited to model workloads, structured diagnostic retention, rotation, health checks, service supervision, and careful handling of disconnects and partial responses.
        - paragraph [ref=e188]: It also needs separate evidence modes. Content-free operational metrics can have one access and retention policy. Raw requests, rendered prompts, model reasoning, tool calls, and responses need a much stricter policy. Combining both into one convenient log makes it too easy for a routine monitoring tool to become a private-conversation archive.
        - paragraph [ref=e189]: The production LLM-Ops-Kit proxy covers substantially more of that operational surface, including streaming diagnostics, rendered prompt inspection, correlation, cancellation classification, wrapper-managed operations, and timed numbered diagnostic-log rotation. That rotation renames the active file and changes its inode, so monitoring readers must reopen the active filename. This lab is here so readers can understand and test the core invariant without copying private configuration or deploying a full stack.
        - heading "Current State" [level=2] [ref=e190]
        - paragraph [ref=e191]:
          - text: The proxy lab, fake upstream, and six regression tests pass with the system Python 3 interpreter in the private publication workspace. The tests verify exact request and response body preservation, bounded route classification, prompt, header, query, and path-segment marker exclusion,
          - code [ref=e192]: "0600"
          - text: enforcement for new and pre-existing metric files, sanitized upstream failure, credential-bearing upstream rejection, and explicit remote-upstream opt-in.
        - paragraph [ref=e193]: The package is published as a teaching artifact and is not represented as production-ready. It passed technical and publisher review before appearing here.
        - heading "Next Work" [level=2] [ref=e194]
        - paragraph [ref=e195]: A useful follow-up exercise would add streaming SSE fixtures while preserving the same content canaries and exact transport assertions. That belongs in a later revision only after the buffered teaching boundary remains clear.
        - paragraph [ref=e196]: "For now, the important result is already executable: the proxy can observe sizes, timing, status, and failure class while leaving the request and response bodies alone and keeping their contents out of its routine metric record."
        - paragraph [ref=e197]: That is the habit I want readers to take away from the exercise. Write the boundary down, put canaries on both sides of it, and make the test fail before a future convenience quietly turns observation into mutation or routine metrics into a content archive.
