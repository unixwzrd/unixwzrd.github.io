        - heading "Run a Clean End-to-End Scan" [level=2] [ref=e118]
        - paragraph [ref=e119]:
          - text: I use a disposable tree under
          - code [ref=e120]: /tmp
          - text: "so I can repeat the exercise from a known starting point. Download both files into it and create one small Markdown source:"
        - code [ref=e124]: rm -rf /tmp/intake-demo mkdir -p /tmp/intake-demo/sources curl -fsSLo /tmp/intake-demo/intake_manifest.py \ https://unixwzrd.ai/assets/code/agent-optimization/intake_manifest.py curl -fsSLo /tmp/intake-demo/test_intake_manifest.py \ https://unixwzrd.ai/assets/code/agent-optimization/test_intake_manifest.py printf '%s\n' '# First note' 'A source with enough text to fingerprint.' \ > /tmp/intake-demo/sources/first.md python3 /tmp/intake-demo/intake_manifest.py \ /tmp/intake-demo/sources \ --db /tmp/intake-demo/manifest.db
        - paragraph [ref=e125]: "The first result is not exciting, and that is good:"
        - code [ref=e129]: "{ \"changed\": 0, \"extractor_version\": \"intake-manifest-v2\", \"missing\": 0, \"new\": 1, \"restored\": 0, \"schema_version\": 2, \"unchanged\": 0 }"
        - paragraph [ref=e130]:
          - text: When I run the same command again, it reports
          - code [ref=e131]: "new: 0"
          - text: and
          - code [ref=e132]: "unchanged: 1"
          - text: ". The program still reads and hashes the file, so I am not claiming that modification time provides a shortcut around the scan. What I am claiming is narrower and easier to verify: an ordinary rerun does not invent another identity or reset work unnecessarily."
        - paragraph [ref=e133]: "Now change the source and ask for the ordered record set:"
        - code [ref=e137]: printf '%s\n' 'A second paragraph changes the content fingerprint.' \ >> /tmp/intake-demo/sources/first.md python3 /tmp/intake-demo/intake_manifest.py \ /tmp/intake-demo/sources \ --db /tmp/intake-demo/manifest.db \ --records
        - paragraph [ref=e138]:
          - text: This time the summary reports
          - code [ref=e139]: "changed: 1"
          - text: ", but the"
          - code [ref=e140]: records
          - text: array still contains one row with the same
          - code [ref=e141]: source_id
          - text: . Its
          - code [ref=e142]: content_sha256
          - text: changes and its
          - code [ref=e143]: processing_state
          - text: returns to
          - code [ref=e144]: "\"discovered\""
          - text: ", which is the behavior I need before handing the source to another stage. Changing the extractor version causes the same reprocessing decision even when the file itself is unchanged; I do not want a new inventory contract masquerading as the old one."
        - heading "Preserve Disappearance and Restoration" [level=2] [ref=e145]
        - paragraph [ref=e146]: "This is where the original small example was not good enough. If a file disappeared, its old row simply survived and still looked current. Deleting the row would have hidden the opposite fact: the source had existed, and something had happened to it. The useful behavior is to retain the record while changing its availability. Move the example outside the source root and scan again:"
        - code [ref=e150]: mv /tmp/intake-demo/sources/first.md /tmp/intake-demo/first.saved python3 /tmp/intake-demo/intake_manifest.py \ /tmp/intake-demo/sources \ --db /tmp/intake-demo/manifest.db \ --records
        - paragraph [ref=e151]:
          - text: The result reports
          - code [ref=e152]: "missing: 1"
          - text: ", and the retained row now has"
          - code [ref=e153]: "availability_state: \"missing\""
          - text: ". Nothing is silently erased and nothing stale is presented as current. Put the same file back and scan once more:"
        - code [ref=e157]: mv /tmp/intake-demo/first.saved /tmp/intake-demo/sources/first.md python3 /tmp/intake-demo/intake_manifest.py \ /tmp/intake-demo/sources \ --db /tmp/intake-demo/manifest.db \ --records
        - paragraph [ref=e158]:
          - text: Now the result reports
          - code [ref=e159]: "restored: 1"
          - text: . The record keeps its original identity and
          - code [ref=e160]: content_changed_at
          - text: value because availability changed but the bytes did not. I still return its processing state to
          - code [ref=e161]: discovered
          - text: ; a downstream stage should make an explicit decision about the restored authority rather than assuming nothing important happened.
        - figure [ref=e162]:
          - 'link "Open full-size diagram: Per-source manifest lifecycle showing first discovery, unchanged and changed scans, retained missing history, and restoration without changing source identity."':
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-02a-source-lifecycle.svg&title=Per-source+manifest+lifecycle+showing+first+discovery%2C+unchanged+and+changed+scans%2C+retained+missing+history%2C+and+restoration+without+changing+source+identity.
            - img "Per-source manifest lifecycle showing first discovery, unchanged and changed scans, retained missing history, and restoration without changing source identity."
          - link "Open full-size diagram" [ref=e164] [cursor=pointer]:
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-02a-source-lifecycle.svg&title=Per-source+manifest+lifecycle+showing+first+discovery%2C+unchanged+and+changed+scans%2C+retained+missing+history%2C+and+restoration+without+changing+source+identity.
        - heading "Inspect the SQLite State" [level=2] [ref=e165]
        - paragraph [ref=e166]:
          - text: The
          - code [ref=e167]: "--records"
          - text: "option is convenient for scripts, but one reason I chose SQLite is that I can inspect the durable state without standing up another service:"
        - code [ref=e171]: sqlite3 -header -column /tmp/intake-demo/manifest.db \ 'SELECT source_id, availability_state, processing_state, size_bytes, extractor_version FROM sources ORDER BY source_path;'
        - paragraph [ref=e172]: The manifest stores canonical paths because it is local provenance state. I would not copy those paths into a public report or diagnostic bundle, and I have not used paths from my own environment in this article. If paths are sensitive in your environment, protect the database or introduce an opaque locator at the system boundary.
        - heading "Run the Canary Suite" [level=2] [ref=e173]
        - paragraph [ref=e174]: "I also do not want the reader to trust this utility simply because the example output looks reasonable. The earlier version left too much correctness as an exercise, so this version includes the acceptance tests I use to check the boundary:"
        - code [ref=e178]: cd /tmp/intake-demo python3 -m unittest -v test_intake_manifest.py
        - paragraph [ref=e179]: "The eight canaries cover the failure modes I care about at this boundary:"
        - table [ref=e180]:
          - rowgroup [ref=e181]:
            - row [ref=e182]:
              - columnheader "Canary" [ref=e183]
              - columnheader "Evidence it demands" [ref=e184]
          - rowgroup [ref=e185]:
            - row [ref=e186]:
              - cell "New, unchanged, and changed" [ref=e187]
              - cell "Three scans retain one stable source row" [ref=e188]
            - row [ref=e189]:
              - cell "Missing and restored" [ref=e190]
              - cell "Disappearance retains history and restoration retains identity" [ref=e191]
            - row [ref=e192]:
              - cell "Bounded selection" [ref=e193]
              - cell "Hidden, non-text, and symlinked sources remain excluded" [ref=e194]
            - row [ref=e195]:
              - cell "Extractor upgrade" [ref=e196]
              - cell [ref=e197]:
                - text: A contract-version change resets processing to
                - code [ref=e198]: discovered
            - row [ref=e199]:
              - cell "Root-scoped reconciliation" [ref=e200]
              - cell "Scanning one configured tree cannot mark another tree’s records missing" [ref=e201]
            - row [ref=e202]:
              - cell "Metadata refresh" [ref=e203]
              - cell "Unchanged content still refreshes observed metadata" [ref=e204]
            - row [ref=e205]:
              - cell "Transaction rollback" [ref=e206]
              - cell "A failed fingerprint leaves no partial source updates" [ref=e207]
            - row [ref=e208]:
              - cell "Schema migration" [ref=e209]
              - cell "The original teaching schema upgrades without losing its row or state" [ref=e210]
        - paragraph [ref=e211]:
          - text: The ordering matters here. The integrity check runs before commit, so a source-read failure or failed
          - code [ref=e212]: PRAGMA quick_check
          - text: rolls back the source changes from that invocation. Schema migration commits separately, which allows an older manifest to be upgraded even when a later source scan fails.
        - heading "Hand Off to Review Without Granting Retrieval" [level=2] [ref=e213]
        - paragraph [ref=e214]:
          - text: This is the point where it is tempting to keep adding features, and it is also where I stop. A downstream extractor can select rows in
          - code [ref=e215]: processing_state = "discovered"
          - text: ", but its output should still enter review in a fail-closed state:"
        - code [ref=e219]: "--- classification: \"unclassified\" review_state: \"pending\" mnemosyne: \"exclude\" source_id: \"src_example\" source_hash: \"example-sha256\" classification_policy: \"[[Wiki/Policies/Document Classification Policy]]\" related: ---"
        - paragraph [ref=e220]: "After a person accepts the material for durable filing, retrieval eligibility remains a separate decision:"
        - code [ref=e224]: "--- classification: \"public\" review_state: \"approved\" mnemosyne: \"exclude\" source_id: \"src_example\" source_hash: \"example-sha256\" classification_policy: \"[[Wiki/Policies/Document Classification Policy]]\" related: - \"[[Wiki/Concepts/Example Topic]]\" ---"
        - paragraph [ref=e225]:
          - text: The important line is still
          - code [ref=e226]: "mnemosyne: \"exclude\""
          - text: . Filing something after review does not silently authorize an agent to retrieve it or inject it into a prompt. I retain rejected candidates too, with
          - code [ref=e227]: "review_state: \"rejected\""
          - text: ","
          - code [ref=e228]: "mnemosyne: \"exclude\""
          - text: ", and a decision timestamp, so the next extraction pass does not present the same material as new work."
        - heading "Current State" [level=2] [ref=e229]
        - paragraph [ref=e230]: I am comfortable calling this utility complete for its stated job. It maintains an inspectable, transactional inventory of allowlisted local text sources and reports their lifecycle across reruns. Its JSON and SQLite contracts are suitable inputs for a separate extractor, and the included tests make that claim reproducible rather than anecdotal.
        - paragraph [ref=e231]: It still does not snapshot application databases, parse live session formats, classify content, remove secrets, review candidates, or populate a memory engine. Those jobs need source-specific adapters and policy decisions. Leaving them outside this program is not unfinished homework. It is how I keep one small component understandable enough to trust.
        - heading "Next Work" [level=2] [ref=e232]
        - paragraph [ref=e233]: "From here I can move into memory governance without pretending the inventory solved it: who may retrieve which durable material, where authorization has to happen, and why access control must narrow the candidate set before ranking begins. The next main installment tells that part of the story, and its own Hands-On companion will turn the ordering into a small fail-closed router with canary tests."
