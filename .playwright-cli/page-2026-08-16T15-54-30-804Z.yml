      - generic [ref=e37]:
        - complementary "Series context" [ref=e38]:
          - paragraph [ref=e39]:
            - strong [ref=e40]:
              - text: Part 2A of
              - link "Local-First Agent Operations" [ref=e41] [cursor=pointer]:
                - /url: /blog/series/local-first-agent-operations/
              - text: ": the Hands-On companion to Part 2."
            - text: This article turns one part of the design into a small runnable example. It appears in the separate
            - link "Hands-On section" [ref=e42] [cursor=pointer]:
              - /url: /blog/hands-on/
            - text: so tutorials remain easy to find without being mixed into the main Technology index.
        - paragraph [ref=e43]:
          - text: While writing
          - 'link "Deterministic First: Building a Knowledge Intake Pipeline" [ref=e44] [cursor=pointer]':
            - /url: /technology/2026/08/19/deterministic-first-building-a-knowledge-intake-pipeline/
          - text: ", I kept coming back to the same problem: a successful first import does not prove very much. Plenty of scripts can create a row once. I wanted to know what happened when I ran the script again, changed a file, removed it, and then put it back. If the inventory could not explain each of those events without producing duplicates or pretending stale data was still current, I was not ready to build anything else on top of it."
        - paragraph [ref=e45]: That led me to a small standard-library Python utility backed by SQLite. It scans one deliberately bounded directory tree, records deterministic source identities, preserves the history of missing files, migrates the earlier teaching schema, and reports what it did as JSON. I stopped it there on purpose. It does not summarize a document, classify it, approve it, or decide whether an agent may retrieve it. I want those later decisions to remain visible instead of disappearing inside an importer that tries to do everything.
        - heading "Start With the Contract" [level=2] [ref=e46]
        - paragraph [ref=e47]: "I started with one row for every allowlisted Markdown or text file. There is nothing particularly glamorous in the record, but every field answers a question I know I will have to ask later:"
        - table [ref=e48]:
          - rowgroup [ref=e49]:
            - row [ref=e50]:
              - columnheader "Field" [ref=e51]
              - columnheader "What it tells me" [ref=e52]
          - rowgroup [ref=e53]:
            - row [ref=e54]:
              - cell [ref=e55]:
                - code [ref=e56]: source_id
              - cell "A stable identity derived from source type and canonical path" [ref=e57]
            - row [ref=e58]:
              - cell [ref=e59]:
                - code [ref=e60]: source_path
              - cell "Where the source authority was observed" [ref=e61]
            - row [ref=e62]:
              - cell [ref=e63]:
                - code [ref=e64]: content_sha256
              - cell "Whether the bytes actually changed" [ref=e65]
            - row [ref=e66]:
              - cell [ref=e67]:
                - code [ref=e68]: size_bytes
                - text: ","
                - code [ref=e69]: mtime_ns
              - cell "Observed metadata, refreshed even when content is unchanged" [ref=e70]
            - row [ref=e71]:
              - cell [ref=e72]:
                - code [ref=e73]: extractor_version
              - cell "Which inventory contract evaluated the source" [ref=e74]
            - row [ref=e75]:
              - cell [ref=e76]:
                - code [ref=e77]: processing_state
              - cell "Whether downstream processing must reconsider it" [ref=e78]
            - row [ref=e79]:
              - cell [ref=e80]:
                - code [ref=e81]: availability_state
              - cell [ref=e82]:
                - text: Whether the source is currently
                - code [ref=e83]: present
                - text: or retained as
                - code [ref=e84]: missing
            - row [ref=e85]:
              - cell [ref=e86]:
                - code [ref=e87]: discovered_at
              - cell "When the manifest first observed the source" [ref=e88]
            - row [ref=e89]:
              - cell [ref=e90]:
                - code [ref=e91]: content_changed_at
              - cell "When its content or extractor contract last changed" [ref=e92]
            - row [ref=e93]:
              - cell [ref=e94]:
                - code [ref=e95]: updated_at
                - text: ","
                - code [ref=e96]: last_seen_at
              - cell "When manifest state changed and when a completed scan last saw it" [ref=e97]
        - paragraph [ref=e98]: I tied identity to the source type and canonical path because those are the facts this little utility can actually prove. If I rename a file, the old path becomes missing and the new path becomes a new source. That may be less clever than guessing that the two files are the same thing, but it is also auditable. In a larger system I would record a known move explicitly or use a stronger identifier supplied by the source system.
        - paragraph [ref=e99]: Once I wrote those rules down, the control flow became almost boring, which is exactly what I wanted. One transaction selects eligible files beneath the configured root, fingerprints each stable read, compares it with the previous state, reconciles missing records within that same root, checks SQLite integrity, and only then commits.
        - figure [ref=e100]:
          - 'link "Open full-size diagram: Manifest scan flow from a bounded source root through allowlisted selection, stable fingerprinting, prior-record comparison, missing-source reconciliation, integrity checking, commit or rollback, and JSON output."':
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-02a-manifest-scan.svg&title=Manifest+scan+flow+from+a+bounded+source+root+through+allowlisted+selection%2C+stable+fingerprinting%2C+prior-record+comparison%2C+missing-source+reconciliation%2C+integrity+checking%2C+commit+or+rollback%2C+and+JSON+output.
            - img "Manifest scan flow from a bounded source root through allowlisted selection, stable fingerprinting, prior-record comparison, missing-source reconciliation, integrity checking, commit or rollback, and JSON output."
          - link "Open full-size diagram" [ref=e102] [cursor=pointer]:
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-02a-manifest-scan.svg&title=Manifest+scan+flow+from+a+bounded+source+root+through+allowlisted+selection%2C+stable+fingerprinting%2C+prior-record+comparison%2C+missing-source+reconciliation%2C+integrity+checking%2C+commit+or+rollback%2C+and+JSON+output.
        - paragraph [ref=e103]: I did not want the convenience of a recursive scan to turn into accidental access to an entire home directory. Hidden paths, non-text suffixes, and file or directory symlinks that could escape the root are excluded. The utility also stats each selected file before and after hashing it. If the file changes during the read, the scan fails and rolls back instead of committing a fingerprint assembled from two different versions.
        - heading "Read or Download the Complete Files" [level=2] [ref=e104]
        - paragraph [ref=e105]: I am including both complete files because sample code is much more useful when the reader can run the same checks I ran. The on-page source viewer and download links use the same public assets, so there is no second hand-maintained copy waiting to drift away from the article. The first disclosure contains the utility, and the second contains its eight-canary acceptance suite.
        - group [ref=e106]:
          - generic "intake_manifest.py python View source" [ref=e107] [cursor=pointer]:
            - generic [ref=e108]:
              - generic [ref=e109]: intake_manifest.py
              - generic [ref=e110]: python
            - generic [ref=e111]: View source
