          - listitem [ref=e30]: A Passive Model Proxy as an AI Debugging Instrument
      - generic [ref=e31]:
        - heading "A Passive Model Proxy as an AI Debugging Instrument" [level=1] [ref=e32]
        - paragraph [ref=e33]:
          - time [ref=e34]: Aug 29, 2026
      - img "A Passive Model Proxy as an AI Debugging Instrument" [ref=e36]
      - generic [ref=e37]:
        - complementary "Series context" [ref=e38]:
          - paragraph [ref=e39]:
            - strong [ref=e40]:
              - text: "Part 6 of a planned 13-part series:"
              - link "Local-First Agent Operations" [ref=e41] [cursor=pointer]:
                - /url: /blog/series/local-first-agent-operations/
              - text: .
            - text: If you are joining the series here, start with
            - link "Measuring Token Optimization Without Breaking the Agent" [ref=e42] [cursor=pointer]:
              - /url: /technology/2026/08/27/measuring-token-optimization-without-breaking-the-agent/
            - text: .
        - paragraph [ref=e43]: I reached a point in this work where looking at the JSON request was no longer enough. The messages appeared to be in the right order, the tools were present, and the model endpoint was answering. Still, the answer occasionally made me wonder what the model had actually been asked.
        - paragraph [ref=e44]: That distinction matters. An OpenAI-compatible request contains structured messages, tool definitions, options, and perhaps multimodal content. The model does not consume that envelope directly. A chat template turns it into the token-bearing prompt the model sees. If that transformation duplicates a tool result, mishandles a role boundary, omits a generation marker, or carries too much history forward, the request can look perfectly reasonable while the rendered prompt is wrong.
        - paragraph [ref=e45]: I needed to see both. I also wanted to see the response as it crossed the same boundary, including streaming fragments and tool calls, without placing a clever new component in the path that quietly changed the evidence. That is why the model proxy became useful to me as a debugging instrument rather than another optimization layer.
        - heading "Three Views of the Same Exchange" [level=2] [ref=e46]
        - paragraph [ref=e47]: I think of a model exchange as having three related views, and each answers a different question.
        - table [ref=e48]:
          - rowgroup [ref=e49]:
            - row [ref=e50]:
              - columnheader "View" [ref=e51]
              - columnheader "What it tells me" [ref=e52]
              - columnheader "What it can hide" [ref=e53]
          - rowgroup [ref=e54]:
            - row [ref=e55]:
              - cell "Raw structured request" [ref=e56]
              - 'cell "What the caller submitted: messages, tools, options, and request shape" [ref=e57]'
              - cell "The exact prompt produced by the model’s chat template" [ref=e58]
            - row [ref=e59]:
              - cell "Rendered prompt" [ref=e60]
              - cell "The role markers, tool syntax, media placeholders, and generation boundary the template produced" [ref=e61]
              - cell "The original transport representation and the exact bytes sent by the caller" [ref=e62]
            - row [ref=e63]:
              - cell "Raw textual and reconstructed response" [ref=e64]
              - cell "What the UTF-8 JSON or SSE response body contained, plus coherent content, reasoning, tool calls, usage, and finish state" [ref=e65]
              - cell "Why the prompt was constructed that way" [ref=e66]
        - paragraph [ref=e67]: None of these is the complete truth by itself. The useful part is being able to correlate all three with one request ID. When an exchange takes a long time, the proxy writes and flushes the request-side diagnostic before the response has completed. I can begin inspecting the prompt while the model is still working rather than waiting for the whole exchange to finish.
        - paragraph [ref=e68]: That sounds like a small operational detail until the model call is the thing that is stuck. A diagnostic record that only appears after success is not much help while diagnosing a hang.
        - figure [ref=e69]:
          - 'link "Open full-size diagram: A passive model proxy forwarding the original request and response bodies while sending raw request, rendered prompt, raw response, and reconstructed response views to a separate restricted diagnostic path." [ref=e70]':
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-06-passive-proxy-boundary.svg&title=A+passive+model+proxy+forwarding+the+original+request+and+response+bodies+while+sending+raw+request%2C+rendered+prompt%2C+raw+response%2C+and+reconstructed+response+views+to+a+separate+restricted+diagnostic+path.
            - img "A passive model proxy forwarding the original request and response bodies while sending raw request, rendered prompt, raw response, and reconstructed response views to a separate restricted diagnostic path." [ref=e71]
          - link "Open full-size diagram" [ref=e73] [cursor=pointer]:
            - /url: /diagram-viewer/?src=%2Fassets%2Fimages%2Fblog%2Fagent-optimization%2Fpost-06-passive-proxy-boundary.svg&title=A+passive+model+proxy+forwarding+the+original+request+and+response+bodies+while+sending+raw+request%2C+rendered+prompt%2C+raw+response%2C+and+reconstructed+response+views+to+a+separate+restricted+diagnostic+path.
        - heading "The Rule That Makes the Evidence Trustworthy" [level=2] [ref=e74]
        - paragraph [ref=e75]: "The proxy has one rule I consider non-negotiable: diagnostic work must not change the request forwarded upstream."
        - paragraph [ref=e76]: The original request body is sent to the configured model endpoint. The original response body bytes are returned to the caller. Prompt rendering happens beside that path and exists only to explain what the selected template would produce. There is no request-rewrite mode hidden behind a convenient option, and the rendered output never feeds back into transport. The proxy filters or regenerates HTTP headers and framing, so this is a body-preservation claim rather than a claim that every response byte on the wire remains identical.
        - paragraph [ref=e77]: That boundary is the reason I can trust what I see. If an observability component also edits the prompt, I have created a different experiment. Perhaps the edit is useful, but I can no longer say that I merely observed the failure. The measuring instrument has become part of the behavior under test.
        - paragraph [ref=e78]: "This became especially important as I worked on context hygiene. The correct place for deliberate prompt filtering was the selected Jinja chat template, where the policy could be reviewed and tested as template behavior. The proxy remained passive. That separation gives me a clean comparison: the raw request shows what arrived, the rendered view shows what the template selected, and the transport path proves that the proxy itself did not rewrite the envelope."
        - heading "What I Can See in a Rendered Prompt" [level=2] [ref=e79]
        - paragraph [ref=e80]: Rendered prompts turn several vague model problems into ordinary engineering problems. I can inspect delimiters, count repeated blocks, find a tool response without its matching call, and see whether the assistant generation marker is in the right place. Context growth stops being a feeling and becomes visible text with identifiable causes.
        - paragraph [ref=e81]:
          - text: Tool calls are a good example. Different clients may represent tool arguments as an object or as an encoded JSON string. The diagnostic renderer normalizes that shape for the template, which lets the template validate what it received consistently. It also provides the Hugging Face-style
          - code [ref=e82]: raise_exception
          - text: helper used by some shipped templates. A malformed sequence can fail with a useful rendering error rather than producing a misleading approximation of the prompt.
        - paragraph [ref=e83]:
          - text: That does not mean every request body should be treated as a chat. Model discovery and other body-bearing calls may pass through the same HTTP service. The proxy now records those as explicit rendering skips instead of claiming that a missing
          - code [ref=e84]: messages
          - text: array is a chat-template failure. This distinction has saved me from chasing errors that were really just the observer applying the wrong interpretation.
        - paragraph [ref=e85]: The rendered response side has a similar job. A streaming response may split visible content, reasoning, tool-call names, and tool arguments across many SSE frames. Reading one network fragment at a time is possible, but it is a miserable way to understand the exchange. For the OpenAI-compatible JSON and SSE traffic under discussion, the proxy retains a raw textual body view decoded as UTF-8 with replacement behavior while reconstructing a human-readable view with finish reason, usage, timing, and an explicit HTTP or SSE completion boundary. This is useful application-level evidence, not an arbitrary binary forensic capture. I get a coherent diagnostic without changing the response body delivered to the client.
        - heading "Failure Reasons Need the Same Discipline" [level=2] [ref=e86]
        - paragraph [ref=e87]: Once a proxy sits between an agent and a model, it becomes tempting to blame it for every failure nearby. Good diagnostics have to resist that temptation.
        - paragraph [ref=e88]: An upstream service can reject a request. The proxy can fail before it reaches the service. A client can disconnect while the proxy is still waiting for upstream response headers. Those events may look alike from a distance, but they imply different repairs. The current implementation classifies an early client disconnect as a canceled exchange rather than manufacturing a proxy HTTP 500 and then displaying a broken-pipe artifact as though it came from the model.
        - paragraph [ref=e89]: This is one of the reasons I care about preserving the raw boundary and recording the derived explanation separately. I want the evidence to tell me which component owned the last successful transition. If the caller went away, I should not spend an afternoon debugging a model response that never had a client waiting to receive it.
        - paragraph [ref=e90]: The same principle applies to degraded operation. A proxy process can be alive while its configured upstream is unavailable. That is running and degraded, not stopped. Process state, route health, and request success are separate facts, and the logs need to keep them separate.
        - heading "Rotation Behavior Is Part of the Operator Interface" [level=2] [ref=e91]
        - paragraph [ref=e92]: I used to think of log rotation as housekeeping. With long-running model calls and live monitoring, it becomes an interface contract.
        - paragraph [ref=e93]: A monitoring process may be tailing the active raw or rendered log while another tool displays it. Renaming the live file and opening a new one can leave an existing reader attached to the old inode. The operator sees a path that looks current while an inode-following reader quietly watches the rotated file.
        - paragraph [ref=e94]:
          - text: The proxy diagnostic writer uses timed numbered rename rotation. At the rotation boundary, older numbered files are shifted, the active file is renamed to
          - code [ref=e95]: .0.log
          - text: ", and the next write creates a new active file at the configured path. The active inode therefore changes. A reader that needs to survive rotation must follow the filename and reopen it rather than assuming an existing descriptor will continue receiving new exchanges."
        - paragraph [ref=e96]: The toolkit also has copy-and-truncate helpers for wrapper-managed service and model log maintenance, but those helpers do not replace the proxy tap’s in-process rotation. Keeping those two mechanisms distinct is not glamorous documentation work, yet it determines whether monitoring remains trustworthy after a rotation boundary.
        - paragraph [ref=e97]: Stable paths also make the command surface simpler. The wrapper can expose status, health, raw logs, rendered logs, a render operation for captured input, and rotation controls without asking every monitoring consumer to understand the proxy process internals.
        - heading "Detailed Diagnostics Are Sensitive by Design" [level=2] [ref=e98]
        - paragraph [ref=e99]: "There is an uncomfortable privacy truth here: a useful prompt diagnostic may contain almost everything I do not want to publish."
        - paragraph [ref=e100]: Raw requests can hold system prompts, conversation history, tool definitions, authorization context, customer material, private paths, and encoded media. Rendered prompts can contain the same information in a form that is easier to read. Reconstructed responses may include model reasoning, visible replies, tool arguments, and generated artifacts. Redacting credential headers is necessary, but it does not turn those records into harmless telemetry.
        - paragraph [ref=e101]: I treat the detailed logs as incident evidence. They need restricted access, deliberate retention, protected file permissions, and deletion rules that match the sensitivity of the work. They should not be copied into a general dashboard simply because NDJSON is convenient to ingest.
        - paragraph [ref=e102]: "Ordinary operational monitoring needs a different record. A content-free metric event can retain the timestamp, request ID, HTTP method, a bounded route class, request and response byte counts, status, duration, and an exception class. It must not retain an arbitrary URL path because variable segments can contain session identifiers, tenant names, or document IDs even when the query string is removed. The bounded record is still enough to answer several useful questions: Is traffic reaching the proxy? Are responses getting larger? Is latency changing? Are upstream failures increasing? It does not answer why a particular prompt went wrong, but that is precisely why it is safer to retain for routine observation."
        - paragraph [ref=e103]: "These two modes should coexist rather than being confused:"
        - table [ref=e104]:
          - rowgroup [ref=e105]:
            - row [ref=e106]:
              - columnheader "Operational need" [ref=e107]
              - columnheader "Evidence" [ref=e108]
              - columnheader "Retention posture" [ref=e109]
          - rowgroup [ref=e110]:
            - row [ref=e111]:
              - cell "Routine health and trend monitoring" [ref=e112]
              - cell "Content-free sizes, timing, status, route class, and error class" [ref=e113]
              - cell "Longer retention can be considered, with access still controlled" [ref=e114]
            - row [ref=e115]:
              - cell "Prompt or tool-call diagnosis" [ref=e116]
              - cell "Raw textual request body, rendered prompt, raw textual response body, and reconstructed exchange" [ref=e117]
              - cell "Short, explicit retention with narrow access" [ref=e118]
            - row [ref=e119]:
              - cell "Publication or external reporting" [ref=e120]
              - cell "Aggregated sanitized measures and invented examples" [ref=e121]
              - cell "No private exchange content" [ref=e122]
        - paragraph [ref=e123]: The production proxy already provides the detailed evidence. A separate content-free production stream remains next work. I am being precise about that because it would be easy to call the existing machine-readable log “metrics” and accidentally imply it contains no prompt or response content. It does.
        - heading "A Hands-On Lab That Proves the Boundary" [level=2] [ref=e124]
        - paragraph [ref=e125]: I wanted this installment to offer more than an architecture discussion, so I built a small standard-library lab for the Hands-On companion. It contains a passive proxy, a deterministic fake model endpoint, and six regression tests. The tests prove that the request body reaches the fake upstream unchanged, the response body returns unchanged, authorization, query, and path-segment canaries do not enter the metrics file, a pre-existing permissive metric file is restricted before append, an unavailable upstream becomes a sanitized 502 record, credential-bearing upstream URLs are rejected, and a remote upstream requires an explicit opt-in.
        - paragraph [ref=e126]: The lab is intentionally smaller than the production component. It buffers responses and omits streaming passthrough, TLS termination, authentication, rotation, and service supervision. Those omissions are part of the lesson. A compact teaching artifact can prove the passive boundary and privacy canaries without pretending to be a gateway someone should expose on a network.
        - paragraph [ref=e127]:
          - text: The companion,
          - 'link "Hands-On 6A: Build and Test a Passive Proxy Lab" [ref=e128] [cursor=pointer]':
            - /url: /hands-on/2026/08/31/hands-on-build-and-test-a-passive-proxy-lab/
          - text: ", walks through running the tests, starting the fake endpoint and proxy in separate terminals, sending an invented request, reading the content-free JSONL record, and forcing an upstream failure. It also includes questions readers can use to extend the experiment safely."
        - paragraph [ref=e129]: What I like about this lab is that the useful result is not a screenshot. It is a set of executable claims. Readers can change the request whitespace, add a fake authorization header, or put a marker in the query string and watch the tests prove which bytes are forwarded and which values are excluded from the retained metrics.
        - heading "Current State" [level=2] [ref=e130]
        - paragraph [ref=e131]: The LLM-Ops-Kit proxy implements a passive forwarding path with separate raw textual request-body, rendered-prompt, raw textual response-body, and reconstructed response diagnostics for the JSON and SSE traffic under discussion. The source and regression suite support request-ID correlation, immediate request-side flushing, streaming reconstruction, template validation helpers, non-chat skip classification, client-disconnect handling, and timed numbered rename rotation. Monitoring readers must reopen the active filename after rotation because its inode changes.
        - paragraph [ref=e132]: The permitted sources do not establish that the proxy is carrying traffic in my current environment, so I am not making that deployment claim here. The new Hands-On proxy, fake endpoint, and six tests passed acceptance before publication. They are teaching artifacts, not a publicly supported production gateway.
        - heading "Next Work" [level=2] [ref=e133]
        - paragraph [ref=e134]: The most useful production addition would be a separate content-free metric stream with explicit retention and access policy. That would let routine monitoring stay away from prompt and response content while preserving the detailed logs for bounded diagnostic work.
        - paragraph [ref=e135]: "The correlated exchange browser remains deferred. When it is built, it should preserve the same separation: request IDs may connect the views, but the interface must make sensitivity and retention visible rather than encouraging casual browsing through private conversations. The broader final-artifact acceptance matrix also needs to be repeated before release claims are made."
        - paragraph [ref=e136]: "For the series, the next installment follows the template boundary into a specific case: multimodal context hygiene, where old images and media-producing tool exchanges can consume context long after they have stopped helping the model. I will publish the attributed Qwen media-history Jinja template with that article, along with its stock fallback, sanitized fixtures, expected results, checksums, Apache-2.0 license, and rollback instructions. Readers using Hermes with a matching Qwen route will have something concrete to test rather than only a description of the policy."
