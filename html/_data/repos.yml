repositories:
  - name: Case-Analytics
    owner: unixwzrd
    overrides:
      title: "Case Analytics"
      description: "AI-powered analysis tool for legal case documents, focusing on parental alienation detection and pattern recognition in high-conflict divorce cases."
      image_url: "/assets/images/child-with-robot.png"
  - name: PA-Awareness-1
    owner: unixwzrd
    overrides:
      title: "Parental Alienation Awareness"
      description: "Parental Alienation Awareness: A data-driven look at the scope, impact, and damage to children, families, and society."
      image_url: "/assets/images/projects/PA-devastation-1.png"
  - name: LogGPT
    owner: unixwzrd
    overrides:
      title: "LogGPT and LogGPT Plus"
      description: "Safari extension for exporting ChatGPT conversations as JSON, with an optional Plus upgrade that preserves generated and uploaded artifacts in a ZIP archive."
      image_url: "/assets/images/projects/LogGPT/LogGPT-Plus.png"
      banner_image_url: "/assets/images/projects/LogGPT-banner.png"
  - name: UnicodeFix
    owner: unixwzrd
    overrides:
      description: "Evidence-based local audit and safe cleanup for hidden Unicode, provenance, and configured watermark signals."
      banner_image_url: "/assets/images/projects/UnicodeFix-banner.png"
  - name: Secrets-Kit
    owner: unixwzrd
    overrides:
      title: "Secrets Kit"
      description: "Local-first secrets management. Version 1 is available; version 2 is in limited-access beta, with macOS/Linux support and peer-to-peer replication."
      image_url: "/assets/images/projects/Secrets-Kit-Banner.png"
      banner_image_url: "/assets/images/projects/Secrets-Kit-Banner.png"
  - name: LLM-Ops-Kit
    owner: unixwzrd
    overrides:
      title: "LLM Ops Kit"
      description: "Operational toolkit for running, deploying, debugging, and maintaining self-hosted AI stacks across hosts."
      banner_image_url: "/assets/images/projects/LLM-Ops-Kit/LLM-OPS-Kit-banner.png"
  - name: extract-chat
    owner: unixwzrd
    overrides:
      title: "Extract Chat"
      description: "Extract ChatGPT sessions from downloaded JSON into HTML and Markdown with metadata, also chunking for ML pipeline."
      banner_image_url: "/assets/images/projects/extract-chat-banner.png"
  - name: WebReader
    owner: unixwzrd
    overrides:
      title: "WebReader for Safari"
      description: "A local-first Safari extension that reads selected text or complete articles aloud through your own text-to-speech system."
      banner_image_url: "/assets/images/projects/WebReader/webreader-banner.png"
  - name: localops-ui-kit
    owner: unixwzrd
    overrides:
      title: "LocalOps UI Kit"
      description: "Python-first operator interfaces for local-first applications, with native browser components and Textual/Rich renderers. No Node or frontend build pipeline required."
      image_url: "/assets/images/projects/localops-ui-kit/localops-ui-kit-banner.png"
      banner_image_url: "/assets/images/projects/localops-ui-kit/localops-ui-kit-banner.png"
      visibility: public
  - name: code-analytics
    owner: unixwzrd
    overrides:
      title: "Code Analysis Suite"
      description: "Local, evidence-backed architecture analysis for Python, JavaScript/JSX, and Ruby. Retain reports, inspect dependencies and change impact, and compare findings before refactoring. WebUI in beta."
      image_url: "/assets/images/projects/code-analytics/code-analysis-banner.png"
      banner_image_url: "/assets/images/projects/code-analytics/code-analysis-banner.png"
      visibility: public
  - name: mlx-harmony
    owner: unixwzrd
    overrides:
      title: "MLX Harmony"
      description: "Run GPT-OSS and other MLX-compatible models through a single, lightweight interface."
      banner_image_url: "/assets/images/projects/MLX-Harmony/MLX_Harmony_Banner.png"
      visibility: none
  - name: ConnectomeAI
    owner: unixwzrd
    overrides:
      title: "ConnectomeAI"
      description: "ConnectomeAI: experiments in mapping and orchestrating AI tools, workflows, and knowledge graphs."
      visibility: public
  - name: venvutil
    owner: unixwzrd
  - name: TorchDevice
    owner: unixwzrd
  - name: oobabooga-macOS
    owner: unixwzrd
    overrides:
      visibility: none
  - name: text-generation-webui-macos
    owner: unixwzrd
    overrides:
      visibility: none
