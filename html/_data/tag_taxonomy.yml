# Canonical vocabulary for tags used by published and scheduled posts.
#
# Authors choose IDs from `tags`. The Topics index uses the order and grouping
# below. `aliases` preserve old Topics fragment anchors and tell maintainers how
# retired spellings were consolidated; aliases are not valid in new front matter.
# Article status belongs in `content_type`, not in `tags`.
settings:
  recommended_min_tags: 2
  recommended_max_tags: 6

groups:
  - id: ai-and-agents
    label: AI and Agents
  - id: development-and-operations
    label: Development and Operations
  - id: data-privacy-and-security
    label: Data, Privacy, and Security
  - id: text-and-provenance
    label: Text and Provenance
  - id: family-law-and-research
    label: Family Law and Research
  - id: projects-and-platforms
    label: Projects and Platforms

content_types:
  - id: introduction
    label: Introductions
    source_tags: [introduction, overview]
  - id: release
    label: Releases
    source_tags: [release, alpha-release]
  - id: update
    label: Updates
    source_tags: [update, project-updates]
  - id: reference
    label: References
    source_tags: [references, citations]

