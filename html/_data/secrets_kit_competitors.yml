    url: https://github.com/gopasspw/gopass
  - title: Security model
    url: https://github.com/gopasspw/gopass/blob/master/docs/security.md
- id: git-crypt
  name: git-crypt
  category: local
  status: Available file tool; pre-1.0 maturity caveat
  storage: Selected Git files are encrypted in the repository and decrypted in an unlocked working tree.
  custody: Shared symmetric repository key, distributed directly or wrapped to GPG recipients.
  splitting: Not threshold splitting; documentation explicitly limits revocation of previously granted access.
  transfer: Normal Git transport and history.
  dependency: Local unlocked work needs no hosted vault; a Git remote is a separate choice.
  resilience: Repository/key backups, not automatic secrets-service failover.
  runtime: Transparent file encryption; not a scoped runtime secrets agent.
  pricing: Free/open source.
  sources:
  - title: README, key sharing and limitations
    url: https://github.com/AGWA/git-crypt
- id: blackbox
  name: BlackBox
  category: local
  status: Available repository-based tooling
  storage: GPG-encrypted secret files stored in a version-control repository.
  custody: Authorized operators retain GPG private keys.
  splitting: GPG recipient distribution, not a documented threshold protocol.
  transfer: Git, Mercurial or Subversion workflows.
  dependency: Local decryption needs files and keys; no BlackBox cloud service.
  resilience: VCS/backups provide copies; no native relay failover.
  runtime: CLI encryption/decryption for repositories and deployment.
  pricing: Free/open source.
  sources:
  - title: Project and usage
    url: https://github.com/StackExchange/blackbox
- id: ansible-vault
  name: Ansible Vault
  category: local
  status: Established infrastructure file encryption
  storage: Encrypted variables or files used by Ansible.
  custody: Operator supplies vault passwords or password-provider scripts.
  splitting: Vault IDs/password selection are not threshold splitting.
  transfer: Encrypted files move through the chosen repository/deployment channel.
  dependency: No Ansible-hosted vault required; external password providers can add dependencies.
  resilience: File/password backup and automation resilience, not peer or relay failover.
  runtime: Ansible task-time decryption; not a general peer-sync client.
  pricing: Community tooling is free; other automation offerings have separate terms.
