  name: Sealed Secrets
  category: adapters
  status: Available Kubernetes controller; adjacent deployment workflow
  storage: Encrypted SealedSecret manifests; controller creates ordinary Kubernetes Secrets.
  custody: Controller private key stays in the cluster; plaintext Kubernetes Secrets have their own at-rest/access requirements.
  splitting: Public-key sealing, not documented threshold secret transport.
  transfer: kubeseal, GitOps and Kubernetes reconciliation.
  dependency: Cluster/controller needed to unseal new objects; not a local workstation vault.
  resilience: Controller-key backups and Kubernetes availability; not LAN peer failover.
  runtime: Kubernetes secret deployment, not turnkey desktop agent injection.
  pricing: Free/open source; cluster costs apply.
  sources:
  - title: Project and threat boundaries
    url: https://github.com/bitnami/sealed-secrets
- id: dotenv-vault
  name: dotenv-vault / .env.vault
  category: adapters
  status: Documented hosted/file workflow; current commercial availability unconfirmed; distinguish from dotenvx
  storage: Encrypted deployment .env.vault files plus a hosted synchronization workflow.
  custody: DOTENV_KEY decrypts deployment files; hosted collaboration has separate service trust.
  splitting: No threshold model established by reviewed docs.
  transfer: CLI push/pull/build and distributed encrypted deployment files.
  dependency: Hosted operations need the service; built files plus deployment keys can be decrypted locally.
  resilience: Built-file availability differs from live synchronization; failover commitments not established.
  runtime: Dotenv ecosystem and deployment/runtime loading.
  pricing: Current hosted/add-on price not established; do not reuse historical pricing.
  sources:
