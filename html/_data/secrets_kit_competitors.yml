checked_on: '2026-10-26'
coverage: 32 alternatives, adjacent workflows and historical offerings; a dated landscape, not an exhaustive claim about every product.
methodology: Primary vendor documentation and project repositories. Vendor-described behavior is not an independent security audit or installed qualification. Unknown or plan-dependent behavior is stated explicitly.
categories:
- id: local
  title: Local and file-based tools
- id: team
  title: Hosted and team vaults
- id: infrastructure
  title: Infrastructure platforms
- id: cloud
  title: Cloud secret services
- id: adapters
  title: Delivery adapters and deployment tools
- id: historical
  title: Historical or changed offerings
style_findings:
- source: https://www.envmesh.dev/
  observation: Device-first headline, a compact trust model and an honest early-access label.
  applied: Lead with local ownership and label 2.0.2 coming soon.
- source: https://envsync.arnav.tech/
  observation: A concrete problem statement, a short workflow and visible security-mode choices.
  applied: Keep setup simple and explain defaults before advanced references.
- source: https://phase.dev/
  observation: Product demonstrations and clear cloud/self-hosted routes precede detailed architecture.
  applied: Use a compact product hero, feature groups and a deeper technical comparison.
- source: https://www.doppler.com/pricing
  observation: Readable plan units and explicit agent billing reduce price ambiguity.
  applied: Separate free LAN peers from paid RSS connection capacity.
- source: https://www.akeyless.io/
  observation: Enterprise identity positioning and trust material suit a larger operational buyer.
  applied: Link detailed custody evidence without borrowing unsupported enterprise claims.
products:
- id: env-sync
  name: env-sync
  category: local
  status: Installable open-source CLI
  storage: Local .env records; default SSH mode is plaintext at rest unless AGE is enabled. Secure-peer mode requires AGE.
  custody: Local AGE identities in secure-peer mode; SSH trust in the default owner mode.
  splitting: Recipient encryption, not documented threshold sharing. Local keys and backups remain an operator responsibility.
  transfer: mDNS discovery; SCP/SSH or HTTPS with mutual TLS, depending on mode.
  dependency: No central secrets server for LAN operation.
  resilience: Local files, write backups and offline peer catch-up; no hosted relay failover established.
  runtime: CLI and shell workflows; explicit peer approval in secure-peer mode.
  pricing: Free/open source.
  sources:
  - title: Product and modes
    url: https://envsync.arnav.tech/
  - title: Security modes
    url: https://envsync.arnav.tech/modes/
  - title: Security
    url: https://envsync.arnav.tech/security/
- id: envmesh
  name: Envmesh
  category: local
  status: Early access / active development
  storage: Vendor describes encrypted local stores on macOS devices.
  custody: Device keys and platform Keychain; approved device relationships.
  splitting: Threshold splitting and recovery custody not established in reviewed sources.
  transfer: Vendor describes direct encrypted device sync over LAN or an existing private route.
  dependency: Design has no coordination server; the private network route can have its own dependencies.
  resilience: Local-first design; no generally released hosted failover service verified.
  runtime: Per-command access and separate agent sessions are described; shipping maturity must be checked.
  pricing: No public price established; early access.
  sources:
  - title: Product and availability
    url: https://www.envmesh.dev/
  - title: Architecture approach
    url: https://www.envmesh.dev/approach
  - title: Positioning
    url: https://www.envmesh.dev/compare
- id: envmanager-oss
  name: EnvManager — julienBelinga GitHub project
  category: local
  status: Experimental MVP; not a production recommendation
  storage: README describes a planned local encrypted store and replicated ciphertext.
  custody: Proposed local user keypairs, per-version data keys and a team key.
  splitting: Ordinary envelope/team-key distribution; threshold splitting not documented.
  transfer: Proposed WebRTC peers with signaling and TURN fallback.
  dependency: Signaling/relay infrastructure for some routes; not a hosted plaintext vault by design.
  resilience: MVP roadmap, not evidence of implemented outage recovery or qualified failover.
  runtime: CLI and editor integrations appear in the roadmap.
  pricing: Open-source project; no commercial price established. Distinct from envmanager.com.
  sources:
  - title: Project README and status
    url: https://github.com/julienBelinga/EnvManager
- id: dotenvx
  name: dotenvx
  category: local
  status: Available CLI; separate optional services
  storage: Encrypted .env values alongside readable variable names.
  custody: Local private keys by default; optional Armor changes custody and access arrangements.
  splitting: Public/private-key encryption; copied private keys still decrypt old copies. No threshold mechanism established.
  transfer: Git or another file distribution channel; local decryption at runtime.
  dependency: Core file workflow needs no live hosted vault; optional services add dependencies.
  resilience: Local files and keys work offline; distribution/backup resilience belongs to the chosen workflow.
  runtime: dotenvx run injects decrypted values into a process.
  pricing: Core CLI is free; optional service/Armor pricing requires separate review.
  sources:
  - title: Product
    url: https://dotenvx.com/
  - title: Encrypted file model
    url: https://dotenvx.com/docs/encrypted-env-file/
  - title: Private keys
    url: https://dotenvx.com/docs/learn/encrypting/private-keys/
- id: sops
  name: SOPS
  category: local
  status: Established open-source file tooling
  storage: 'Encrypted structured files: YAML, JSON, ENV, INI and binary content.'
  custody: age/PGP recipients or configured cloud KMS/Vault Transit decryptors control access.
  splitting: Optional key groups and Shamir threshold can require multiple groups. Ordinary multiple recipients are different.
  transfer: Files usually travel through Git or deployment tooling; not native peer synchronization.
  dependency: age/PGP can decrypt locally; a KMS backend requires that service.
  resilience: No SOPS-hosted failover. File copies, keys and chosen KMS determine recovery.
  runtime: CLI editing/decryption and infrastructure workflows; not an agent broker.
  pricing: Free/open source; KMS and hosting may cost extra.
  sources:
  - title: Project
    url: https://getsops.io/
  - title: Reference and key groups
    url: https://getsops.io/docs/reference/
  - title: Source
    url: https://github.com/getsops/sops
- id: pass
  name: pass / password-store
  category: local
  status: Established Unix CLI
  storage: Individual GPG-encrypted files in a local password store.
  custody: User-held GPG private keys; authorized recipients can decrypt.
  splitting: Multiple GPG recipients are not threshold shares. Key backup is user-managed.
  transfer: Optional Git distribution of encrypted files.
  dependency: Local access needs no vendor server once files and keys are present.
  resilience: Offline local access; remote Git availability affects updates rather than existing copies.
  runtime: Unix command-line integration; application injection requires an appropriate workflow.
  pricing: Free/open source.
  sources:
  - title: Product
    url: https://www.passwordstore.org/
  - title: Primary README
    url: https://git.zx2c4.com/password-store/about/
- id: gopass
  name: gopass
  category: local
  status: Available open-source CLI
  storage: Local password stores with supported crypto/storage backends.
  custody: Local GPG or age keys according to backend and configuration.
  splitting: Recipient access and operator key backup; no general threshold service established.
  transfer: Git/filesystem-backed team stores rather than a dedicated relay mesh.
  dependency: Local stores can operate without a live vendor service.
  resilience: Existing local copies remain usable; synchronization and key recovery depend on the backend.
  runtime: CLI and team workflows; assess the selected backend and integration.
  pricing: Free/open source.
  sources:
