    url: https://docs.ansible.com/projects/ansible/latest/vault_guide/index.html
- id: bitwarden
  name: Bitwarden Secrets Manager
  category: team
  status: Available hosted service; Enterprise self-hosting
  storage: Encrypted organization vault with client-side decryption.
  custody: Client-held cryptographic access; machine accounts receive scoped access tokens.
  splitting: Account recovery and key wrapping are distinct from threshold secret delivery.
  transfer: Cloud or self-hosted service APIs; no native LAN peer sync listed.
  dependency: Service required for fresh retrieval; do not infer disconnected operation.
