  splitting: Layered encryption/KMS is not a documented threshold-sharing scheme.
  transfer: TLS API delivery and deployment integrations.
  dependency: Service for fresh data; CLI can use an encrypted local fallback.
  resilience: Documented primary/failover infrastructure plus encrypted fallback snapshots; these are separate protections.
  runtime: doppler run, service tokens/accounts and integrations.
