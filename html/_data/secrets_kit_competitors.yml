- id: vault
  name: HashiCorp Vault / HCP Vault
  category: infrastructure
  status: Available server platform; CE, Enterprise and HCP differ
  storage: Encrypted backend behind a server-side cryptographic barrier.
  custody: An unsealed server can decrypt authorized requests; KMS/HSM auto-unseal adds an external dependency.
  splitting: Default Shamir shares protect the unseal/root-key path, not each transmitted secret. Auto-unseal uses recovery keys differently.
  transfer: Authenticated API/CLI, agents, leases and dynamic credentials.
  dependency: Reachable unsealed server and supporting storage/identity services.
  resilience: Active/standby HA with supported storage; Enterprise/HCP add replication and DR capabilities.
  runtime: CLI/API, agents and broad infrastructure integrations.
  pricing: CE has no software license fee; operations cost extra. HCP uses cluster-hour/client metering; Enterprise quote-based.
  sources:
