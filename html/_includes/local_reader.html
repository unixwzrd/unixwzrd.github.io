{% unless page.local_reader == false %}
  {% assign local_reader_asset_version = site.time | date: "%s" %}
  {% assign local_reader_asset = '/assets/js/article-tts-player.js' | relative_url | append: '?v=' | append: local_reader_asset_version %}
  <script data-local-reader-loader>
    (() => {
      "use strict";
      if (!["localhost", "127.0.0.1", "[::1]"].includes(window.location.hostname)) return;
      if (document.querySelector("script[data-local-reader-player]")) return;
      const script = document.createElement("script");
      script.src = {{ local_reader_asset | jsonify }};
      script.defer = true;
      script.dataset.localReaderPlayer = "";
      document.body.append(script);
    })();
  </script>
{% endunless %}
