<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Redirecting&hellip;</title>
    <link rel="canonical" href="{{ page.redirect.to | escape }}">
    <meta name="robots" content="noindex">
    <script>
      (function () {
        var destination = new URL({{ page.redirect.to | jsonify }}, window.location.href);
        var incoming = window.location.search.slice(1);
        // Keep the raw query, including repeated keys, empty values and encoding.
        if (incoming) {
          destination.search += (destination.search ? '&' : '?') + incoming;
        }
        if (!destination.hash) {
          destination.hash = window.location.hash;
        }
        window.location.replace(destination.href);
      }());
    </script>
    <meta http-equiv="refresh" content="0; url={{ page.redirect.to | escape }}">
  </head>
  <body>
    <h1>Redirecting&hellip;</h1>
    <a href="{{ page.redirect.to | escape }}">Click here if you are not redirected.</a>
  </body>
</html>
